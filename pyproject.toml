[project]
name = "z-deploy"
version = "0.1.0"
description = "MuJoCo + ROS 2 deployment workspace for the G1 / H2 / DR02 humanoids"
readme = "README.md"
authors = [
    { name = "Green-fr0g", email = "2738112030@qq.com" }
]
# ROS 2 Humble on Ubuntu 22.04 ships CPython 3.10 extensions (rclpy, the
# rosidl-generated z_msgs bindings), so the venv must be built on 3.10 too.
requires-python = ">=3.10,<3.11"
dependencies = [
    # ROS 2's ament/rosidl Python build steps import setuptools directly.
    "setuptools>=61",
    "mujoco>=3.1",
    "mjviser>=0.0.14",
    "viser>=1.0",
    "scipy",
    # ROS Humble ships binary extensions built against NumPy 1.x.
    "numpy<1.25",
    "PyYAML>=6.0",
]

[project.scripts]
z-deploy = "z_deploy:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Prefer the system CPython that rclpy was built against over a uv-managed one.
python-preference = "system"

[tool.uv.build-backend]
# The venv holds dependencies only. The ROS 2 packages under src/ are built by
# `colcon build`, which also has to generate the z_msgs Python bindings; a uv
# wheel of them would be incomplete, so uv_build only packages src/z_deploy.
module-root = "src"
