  action_scale: [0.351, 0.351, 0.548, 0.351, 0.439, 0.439, 0.351, 0.351, 0.548, 0.351, 0.439, 0.439, 0.548, 0.439, 0.439, 0.439, 0.439, 0.439, 0.439, 0.439, 0.290, 0.290, 0.439, 0.439, 0.439, 0.439, 0.439, 0.290, 0.290]
