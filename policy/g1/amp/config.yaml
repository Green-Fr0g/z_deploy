  lin_vel_scale: 1.0
  dof_pos_scale: 1.0
  dof_vel_scale: 1.0
  # Directional magnitudes: +x, -x, +y, -y, +yaw, -yaw (0 disables that direction).
  commands_scale: [4.0, 3.0, 1.0, 1.0, 3.0, 3.0]
